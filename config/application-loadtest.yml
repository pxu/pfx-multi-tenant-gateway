# Profile "loadtest", used together with "local" (./scripts/stack.sh loadtest up):
#   SPRING_PROFILES_ACTIVE=local,loadtest
# Every LT_* variable is optional; the defaults are the application's own.
spring:
  datasource:
    url: jdbc:h2:mem:loadtest;DB_CLOSE_DELAY=-1   # fresh config each run, nothing left behind

server:
  tomcat:
    # Connections Tomcat accepts at once (Spring Boot default 8192); every in-flight request holds one.
    max-connections: ${LT_TOMCAT_MAX_CONNECTIONS:8192}

gateway:
  ip-rate-limit:
    # The per-address limit (1200/min) would cap one load generator at 20 requests per second.
    requests-per-minute: 0
  proxy:
    # Upstream pool per host:port. With a single upstream it caps throughput at about
    # pool / upstream latency; raise it to see past that limit.
    max-connections-per-route: ${LT_POOL_PER_ROUTE:100}
    max-total-connections: ${LT_POOL_TOTAL:500}   # all upstreams together
