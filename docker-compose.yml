# Gateway + an echo upstream that returns the request it received, so you can see exactly which
# headers the gateway forwards. No Redis, no separate database: rate limits live in memory and the
# config is in an embedded H2 database file on the gateway-data volume (survives restarts).
#
#   docker compose up -d --build
#   ./scripts/demo.sh
services:
  echo:
    image: mendhak/http-https-echo:43
    environment:
      HTTP_PORT: 8080

  gateway:
    build: .
    environment:
      # user "ops" logs in with key "local-ops-key" (this is its SHA-256); local only
      GATEWAY_OPS_KEY_SHA256: 1d93d8aa6bb02cfaf47c6b57d9c45c7092ab3ae2752bd3549c71afeae9879485
      # another database: GATEWAY_DB_URL (+ GATEWAY_DB_USER, GATEWAY_DB_PASSWORD, GATEWAY_DB_PLATFORM)
    volumes:
      - gateway-data:/app/data        # H2 file: jdbc:h2:file:./data/gateway
    ports:
      - "8080:8080"   # data plane + admin API
      - "8081:8081"   # health

volumes:
  gateway-data:
