# Load-test stack: the gateway in front of an upstream that does nothing (nginx, "ok"), so the numbers
# measure the gateway rather than the backend. Ports differ from the demo stack, so both can run.
#
#   docker compose -f ops/loadtest/docker-compose.yml up -d --build
#   ./scripts/loadtest.sh                       # needs vegeta (brew install vegeta) and python3
#   docker compose -f ops/loadtest/docker-compose.yml down
#
# Run the load generator on another machine for real numbers: on one laptop it competes with the
# gateway for CPU, and Docker Desktop adds a virtualised network in between.
name: gateway-loadtest
services:
  upstream:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${LT_UPSTREAM_PORT:-9090}:80"     # the baseline: the same load straight at the upstream

  slow-upstream:
    # Every response delayed by a random 100 ms - 5 s. Use it with
    #   UPSTREAM=http://localhost:9091 UPSTREAM_IN_DOCKER=http://slow-upstream:80 ./scripts/loadtest.sh
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-slow.conf:/etc/nginx/nginx.conf:ro
      - ./delay.js:/etc/nginx/delay.js:ro
    ports:
      - "${LT_SLOW_UPSTREAM_PORT:-9091}:80"

  gateway:
    build: ../..
    environment:
      # user "ops" logs in with key "local-ops-key"; local only
      GATEWAY_OPS_KEY_SHA256: 1d93d8aa6bb02cfaf47c6b57d9c45c7092ab3ae2752bd3549c71afeae9879485
      # The per-address limit (1200/min) would cap one load generator at 20 requests per second.
      GATEWAY_IPRATELIMIT_REQUESTSPERMINUTE: "0"
      # Fresh in-memory config each run (no volume, nothing left behind)
      GATEWAY_DB_URL: "jdbc:h2:mem:loadtest;DB_CLOSE_DELAY=-1"
      # Upstream pool per host:port (default 100 = the app default). With a single upstream it caps
      # throughput at about 100 / upstream latency; raise it to see past that limit.
      GATEWAY_PROXY_MAXCONNECTIONSPERROUTE: "${LT_POOL_PER_ROUTE:-100}"
      GATEWAY_PROXY_MAXTOTALCONNECTIONS: "${LT_POOL_TOTAL:-500}"          # all upstreams together (app default)
      # Connections Tomcat accepts at once (Spring Boot default 8192); every in-flight request holds one.
      SERVER_TOMCAT_MAXCONNECTIONS: "${LT_TOMCAT_MAX_CONNECTIONS:-8192}"
      # Extra JVM flags, e.g. LT_JAVA_OPTS="-XX:+UseZGC -XX:+ZGenerational" (see REPORT.md, test 2)
      JAVA_TOOL_OPTIONS: "${LT_JAVA_OPTS:-}"
    ports:
      - "${LT_GATEWAY_PORT:-9080}:8080"
      - "${LT_MANAGEMENT_PORT:-9081}:8081"
    depends_on:
      - upstream
      - slow-upstream
