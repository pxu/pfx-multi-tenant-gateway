# An upstream that costs as little as possible: answer "ok", keep connections open, log nothing.
worker_processes auto;
events {
    worker_connections 16384;
}
http {
    access_log off;
    # Longer than the gateway's pool idle timeout (60s), so the gateway, not nginx, closes idle connections.
    keepalive_timeout 75s;
    keepalive_requests 1000000;
    server {
        listen 80;
        location / {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
