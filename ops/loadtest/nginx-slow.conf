# A slow upstream: each response is delayed by a random 100 ms - 5 s (delay.js), otherwise like nginx.conf.
load_module modules/ngx_http_js_module.so;
worker_processes auto;
events {
    worker_connections 32768;
}
http {
    access_log off;
    keepalive_timeout 75s;
    keepalive_requests 1000000;
    js_import main from /etc/nginx/delay.js;
    server {
        listen 80;
        location / {
            default_type text/plain;
            js_content main.delayed;
        }
    }
}
