# Every setting comes from an environment variable, so one jar plays every upstream:
#   VERSION=stable PORT=9201 java -jar upstream-app.jar                 (demo: stable)
#   VERSION=canary FAIL_PCT=60 PORT=9202 java -jar upstream-app.jar     (demo: the bad canary)
#   PLAIN_OK=true PORT=9090 java -jar upstream-app.jar                  (load test: answers "ok" at once)
#   PLAIN_OK=true DELAY_MIN_MS=100 DELAY_MAX_MS=5000 PORT=9091 ...      (load test: slow upstream)
spring:
  application:
    name: upstream-app
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true          # a delayed request parks a virtual thread, not a platform one

server:
  port: ${PORT:8080}
  tomcat:
    # Thousands of slow requests wait at once in load test 2; the default (8192) would make the
    # upstream, not the gateway, the limit being measured.
    max-connections: ${MAX_CONNECTIONS:30000}
    accept-count: 1000
    keep-alive-timeout: 90s       # longer than the gateway's 60s pool idle timeout: the gateway closes idle connections
    max-keep-alive-requests: -1   # unlimited, like the nginx it replaces

upstream:
  version: ${VERSION:stable}           # sent as X-Upstream-Version on every response
  fail-pct: ${FAIL_PCT:0}              # 0-100: that share of requests (except /healthz) gets 503 before anything else
  max-delay-ms: ${MAX_DELAY_MS:30000}  # cap for /delay and /random-delay
  plain-ok: ${PLAIN_OK:false}          # echo paths answer "ok\n" instead of JSON (cheapest possible upstream)
  delay-min-ms: ${DELAY_MIN_MS:0}      # every request (except /healthz) first waits a uniform random
  delay-max-ms: ${DELAY_MAX_MS:0}      # time in [min, max] ms; 0/0 = no delay

logging:
  level:
    root: WARN
    com.example.upstream: INFO
