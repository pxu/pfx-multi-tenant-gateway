# DigitalOcean App Platform spec for the canary upstream.
#   doctl apps create --spec upstream-app/deploy/canary.yaml
# A separate app per variant on purpose: each gets its own *.ondigitalocean.app host, and the gateway
# keeps one circuit breaker per upstream host:port, so a failing canary must not share stable's host.
# The repository is private: connect DigitalOcean's GitHub app to it first (Apps > Create App > GitHub).
name: gw-upstream-canary
region: nyc
services:
  - name: upstream
    github:
      repo: pxu/pfx-multi-tenant-gateway
      branch: main
      deploy_on_push: false
    source_dir: upstream-app
    dockerfile_path: upstream-app/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
    envs:
      - key: VERSION
        value: canary
      - key: FAIL_PCT
        value: "60"   # share of requests answered 503 on purpose (the canary is the bad release)
